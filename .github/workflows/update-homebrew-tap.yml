name: Update Homebrew tap

# A release published by hand arrives here as an event. A release CI cuts with
# the default GITHUB_TOKEN cannot trigger another workflow, so CI runs the same
# formula action inside its serialized release job instead.
on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bump-formula:
    name: Bump formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out quorum
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Homebrew tap
        uses: ./.github/actions/update-homebrew-tap
        with:
          tag: ${{ github.event.release.tag_name }}
          deploy-key: ${{ secrets.TAP_DEPLOY_KEY }}
