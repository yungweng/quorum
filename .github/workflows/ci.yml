name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share a group so a new head cancels the old run. Main pushes
  # use a unique group because GitHub replaces an existing pending run even
  # when cancel-in-progress is false, which could discard a release commit.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "::error::Run gofmt on these files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Smoke-test CLI
        run: |
          go run . --help >/dev/null
          go run . --version >/dev/null
          # Each subcommand's help is built from the resolved config, so this
          # also catches a format string that no longer matches its arguments.
          go run . review --help >/dev/null
          go run . babysit --help >/dev/null
          # An unknown option must fail rather than be silently ignored.
          if go run . review --not-a-real-flag 123 >/dev/null 2>&1; then
            echo "::error::an unknown option was accepted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  # Merging a version bump is what releases. The tag is derived from Version in
  # main.go, so a merge that does not change it releases nothing. The current
  # main commit itself must introduce the version; a failed release cannot be
  # retried from a later, unrelated commit. Nothing here runs until the tests
  # and the linter have passed on the commit being tagged.
  release:
    name: Release
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out whether this commit is a release
        id: plan
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          read_version() {
            git show "$1:main.go" | sed -n 's/^var Version = "\(.*\)"$/\1/p'
          }
          verify_tag_target() {
            local tag_sha
            if ! tag_sha=$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha); then
              echo "::error::could not resolve existing tag $TAG"
              return 1
            fi
            if [[ "$tag_sha" != "$CURRENT_SHA" ]]; then
              echo "::error::$TAG points to $tag_sha, not release commit $CURRENT_SHA"
              return 1
            fi
          }
          latest_release_version() {
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' |
              sort -V |
              tail -n 1
          }
          version_is_greater() {
            local greatest
            greatest=$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)
            [[ "$1" != "$2" && "$greatest" == "$1" ]]
          }

          VERSION=$(read_version "$CURRENT_SHA" || true)
          if [[ -z "$VERSION" ]]; then
            echo "::error::could not read Version from main.go"
            exit 1
          fi

          PARENT_VERSION=$(read_version "${CURRENT_SHA}^1" || true)
          if [[ -z "$PARENT_VERSION" ]]; then
            echo "::error::could not read Version from the previous main commit"
            exit 1
          fi
          if [[ "$VERSION" == "$PARENT_VERSION" ]]; then
            echo "Version $VERSION was not introduced by this commit, nothing to do."
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not X.Y.Z"
            exit 1
          fi

          LATEST_VERSION=$(latest_release_version)
          if [[ -n "$LATEST_VERSION" ]] && version_is_greater "$LATEST_VERSION" "$VERSION"; then
            echo "::error::refusing to release v$VERSION after newer release v$LATEST_VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! verify_tag_target; then
              exit 1
            fi
            echo "$TAG is already released; the tap can still be retried."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! TAG_REFS=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}"); then
            echo "::error::could not check whether tag $TAG already exists"
            exit 1
          fi
          if [[ -n "$TAG_REFS" ]]; then
            if ! verify_tag_target; then
              exit 1
            fi
          fi

          echo "Releasing $TAG from $CURRENT_SHA."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Cut the release
        if: steps.plan.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          latest_release_version() {
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' |
              sort -V |
              tail -n 1
          }
          version_is_greater() {
            local greatest
            greatest=$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)
            [[ "$1" != "$2" && "$greatest" == "$1" ]]
          }

          VERSION=${TAG#v}
          LATEST_VERSION=$(latest_release_version)
          if [[ -n "$LATEST_VERSION" ]] && version_is_greater "$LATEST_VERSION" "$VERSION"; then
            echo "::error::refusing to release $TAG after newer release v$LATEST_VERSION"
            exit 1
          fi

          # One call, so there is no window where the tag exists without the
          # release it belongs to.
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes \
            --latest=false

      # Every creator publishes as non-latest first, then converges GitHub's
      # Latest marker on the highest stable version. Completion order cannot
      # make an older release Latest.
      - name: Mark the highest version as latest
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_release_version() {
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' |
              sort -V |
              tail -n 1
          }

          for _ in 1 2 3 4 5; do
            LATEST_VERSION=$(latest_release_version)
            if [[ -z "$LATEST_VERSION" ]]; then
              echo "::error::no stable X.Y.Z release exists after publishing"
              exit 1
            fi
            LATEST_TAG="v$LATEST_VERSION"
            gh release edit "$LATEST_TAG" --latest

            # A concurrent creator may have published or changed Latest between
            # the listing and the edit. Stop only after both views agree.
            ACTUAL_LATEST=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
            if [[ "$ACTUAL_LATEST" == "$LATEST_TAG" ]] &&
              [[ "$(latest_release_version)" == "$LATEST_VERSION" ]]; then
              exit 0
            fi
          done
          echo "::error::release order kept changing while setting Latest"
          exit 1

      - name: Update Homebrew tap
        if: steps.plan.outputs.tag != ''
        uses: ./.github/actions/update-homebrew-tap
        with:
          tag: ${{ steps.plan.outputs.tag }}
          deploy-key: ${{ secrets.TAP_DEPLOY_KEY }}
