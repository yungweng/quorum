name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is free. Superseding a run on main is not:
  # it can land between cutting the release and updating the formula.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "::error::Run gofmt on these files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Smoke-test CLI
        run: |
          go run . --help >/dev/null
          go run . --version >/dev/null
          # Each subcommand's help is built from the resolved config, so this
          # also catches a format string that no longer matches its arguments.
          go run . review --help >/dev/null
          go run . babysit --help >/dev/null
          # An unknown option must fail rather than be silently ignored.
          if go run . review --not-a-real-flag 123 >/dev/null 2>&1; then
            echo "::error::an unknown option was accepted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  # Merging a version bump is what releases. The tag is derived from Version in
  # main.go, so a merge that does not change it releases nothing, and a second
  # push of the same version finds the tag taken and stops. Nothing here runs
  # until the tests and the linter have passed on the very commit being tagged.
  release:
    name: Release
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out whether this commit is a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' main.go)
          if [[ -z "$VERSION" ]]; then
            echo "::error::could not read Version from main.go"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to do."
            exit 0
          fi
          echo "Releasing $TAG."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cut the release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # One call, so there is no window where the tag exists without the
          # release it belongs to.
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes

  # Called rather than triggered: see the comment in the workflow itself.
  tap:
    name: Update Homebrew tap
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
