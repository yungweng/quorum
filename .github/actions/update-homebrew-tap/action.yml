name: Update Homebrew tap
description: Point the quorum formula at a release without allowing a downgrade

inputs:
  tag:
    description: The release tag to publish, e.g. v1.0.2
    required: true
  deploy-key:
    description: SSH key that can push to the Homebrew tap
    required: true

runs:
  using: composite
  steps:
    - name: Check out tap
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: yungweng/homebrew-tap
        ssh-key: ${{ inputs.deploy-key }}
        path: tap

    - name: Check release order
      id: plan
      env:
        TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        FORMULA=tap/Formula/quorum.rb
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::release tag $TAG is not vX.Y.Z"
          exit 1
        fi
        CURRENT_TAG=$(sed -n \
          's|^  url ".*/archive/refs/tags/\(v[^"]*\)\.tar\.gz"$|\1|p' \
          "$FORMULA")
        if [[ ! "$CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::could not read a vX.Y.Z tag from $FORMULA"
          exit 1
        fi
        NEWEST_TAG=$(printf '%s\n%s\n' "$CURRENT_TAG" "$TAG" |
          LC_ALL=C sort -V | tail -n 1)
        if [[ "$NEWEST_TAG" != "$TAG" ]]; then
          echo "$FORMULA already points to newer $CURRENT_TAG; not replacing it with $TAG."
          echo "update=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "update=true" >> "$GITHUB_OUTPUT"
        echo "url=https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz" \
          >> "$GITHUB_OUTPUT"

    - name: Compute release tarball checksum
      if: steps.plan.outputs.update == 'true'
      id: checksum
      env:
        URL: ${{ steps.plan.outputs.url }}
      shell: bash
      run: |
        # When CI just created the release, the tarball can take a moment to
        # exist. Failing here would ship a release with a stale formula.
        for attempt in 1 2 3 4 5; do
          if curl -sSfL "$URL" -o release.tar.gz; then
            break
          fi
          if [[ $attempt == 5 ]]; then
            echo "::error::$URL did not become available"
            exit 1
          fi
          sleep $((attempt * 5))
        done
        echo "sha256=$(sha256sum release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Update formula
      if: steps.plan.outputs.update == 'true'
      env:
        SHA256: ${{ steps.checksum.outputs.sha256 }}
        TAG: ${{ inputs.tag }}
        URL: ${{ steps.plan.outputs.url }}
      shell: bash
      run: |
        FORMULA=tap/Formula/quorum.rb
        sed -i \
          -e "s|^  url \".*\"$|  url \"$URL\"|" \
          -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
          "$FORMULA"
        if git -C tap diff --quiet; then
          echo "Formula already up to date, nothing to push."
          exit 0
        fi
        git -C tap config user.name "github-actions[bot]"
        git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
        git -C tap commit -am "quorum ${TAG}"
        git -C tap push
